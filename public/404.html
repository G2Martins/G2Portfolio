<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 · Gustavo Martins Gripaldi</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; --bg:#faf9f6; --ink:#21201d; --ink2:#605d56; --line:#e6e2d8; --acc:#003add; }
    @media (prefers-color-scheme: dark) { :root { --bg:#171614; --ink:#f2f0ea; --ink2:#a6a296; --line:#2e2c28; --acc:#668fff; } }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
      font:16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; padding:24px; }
    p.k { font:11px ui-monospace, monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--ink2); }
    h1 { font-weight:300; letter-spacing:-.045em; font-size:clamp(40px, 8vw, 72px); line-height:1; margin:.3em 0; }
    a { color:var(--acc); text-underline-offset:4px; margin-right:18px; }
  </style>
</head>
<body>
  <main>
    <p class="k">404</p>
    <h1>Página não encontrada.</h1>
    <p style="color:var(--ink2)">Page not found.</p>
    <p><a href="/">Ir para o início</a><a href="/en/">Go to homepage</a></p>
  </main>
</body>
</html>
