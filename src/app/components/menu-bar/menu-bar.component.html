<nav class="fixed top-0 left-0 right-0 z-50 bg-[#0D1224]/95 backdrop-blur-md border-b border-[#1a1443]/50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 flex items-center justify-between py-4">
    <!-- Logo -->
    <a routerLink="/" class="flex items-center gap-1 font-bold text-xl select-none cursor-pointer">
      <span class="text-[#16f2b3]">&lt;</span>
      <span class="text-white">G2</span>
      <span class="text-[#16f2b3]">/&gt;</span>
    </a>

    <!-- Desktop Navigation -->
    <ul class="hidden md:flex items-center space-x-8">
      <li><a class="nav-link" (click)="scrollToAbout()">About</a></li>
      <li><a class="nav-link" (click)="scrollToSkills()">Skills</a></li>
      <li><a class="nav-link" (click)="scrollToExperience()">Experience</a></li>
      <li><a class="nav-link" (click)="scrollToPortfolio()">Portfolio</a></li>
      <li><a class="nav-link" (click)="scrollToContact()">Contact</a></li>
    </ul>

    <!-- Hamburger Button (Mobile) -->
    <button
      class="md:hidden text-white p-2 focus:outline-none"
      (click)="toggleMenu()"
      aria-label="Toggle menu"
    >
      <svg *ngIf="!isMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
      <svg *ngIf="isMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>

  <!-- Mobile Drawer -->
  <div
    class="md:hidden overflow-hidden transition-all duration-300 ease-in-out"
    [style.maxHeight]="isMenuOpen ? '400px' : '0px'"
  >
    <ul class="bg-[#0D1224] border-t border-[#1a1443]/50 px-6 py-4 flex flex-col space-y-1">
      <li><a class="mobile-nav-link" (click)="scrollToAbout(); closeMenu()">About</a></li>
      <li><a class="mobile-nav-link" (click)="scrollToSkills(); closeMenu()">Skills</a></li>
      <li><a class="mobile-nav-link" (click)="scrollToExperience(); closeMenu()">Experience</a></li>
      <li><a class="mobile-nav-link" (click)="scrollToPortfolio(); closeMenu()">Portfolio</a></li>
