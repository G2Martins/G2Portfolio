<section
  id="skills"
  class="relative z-50 border-t my-12 lg:my-24 py-12 px-6"
  style="background-color: #0d1224"
>
  <div class="w-[200px] h-[200px] bg-violet-100 rounded-full absolute top-6 left-[42%] translate-x-1/2 filter blur-3xl opacity-10 pointer-events-none"></div>

  <!-- Section Header -->
  <div class="flex justify-center mb-12">
    <div class="flex items-center gap-3">
      <span class="w-24 h-[2px] bg-gradient-to-r from-transparent to-[#1a1443]"></span>
      <span class="bg-[#1a1443] w-fit text-white p-2 px-5 text-xl rounded-md">Skills</span>
      <span class="w-24 h-[2px] bg-gradient-to-l from-transparent to-[#1a1443]"></span>
    </div>
  </div>

  <!-- Row 1: Data Engineering (scrolls left) -->
  <div class="mb-2 px-2 max-w-7xl mx-auto">
    <span class="text-xs text-[#16f2b3] tracking-widest uppercase font-medium opacity-70">Data Engineering</span>
  </div>
  <div class="overflow-hidden mb-8">
    <div class="marquee-left flex gap-5" style="width: max-content">
      <div *ngFor="let skill of dataSkillsDoubled" class="skill-chip skill-chip-green">
        <img [src]="skill.icon" [alt]="skill.name" class="w-7 h-7 object-contain flex-shrink-0">
        <span>{{ skill.name }}</span>
      </div>
    </div>
  </div>

  <!-- Row 2: Full Stack (scrolls right) -->
  <div class="mb-2 px-2 max-w-7xl mx-auto">
    <span class="text-xs text-[#a78bfa] tracking-widest uppercase font-medium opacity-70">Full Stack Development</span>
  </div>
  <div class="overflow-hidden">
    <div class="marquee-right flex gap-5" style="width: max-content">
      <div *ngFor="let skill of fullStackSkillsDoubled" class="skill-chip skill-chip-violet">
        <img [src]="skill.icon" [alt]="skill.name" class="w-7 h-7 object-contain flex-shrink-0">
        <span>{{ skill.name }}</span>
      </div>
    </div>
  </div>
</section>
