<section id="portfolio" class="relative py-16 bg-[#0d1224] text-white border-t border-[#1a1443]/30">
  <!-- Glow -->
  <div class="absolute top-0 right-0 w-96 h-96 bg-violet-700 rounded-full filter blur-[120px] opacity-10 pointer-events-none"></div>

  <div class="max-w-7xl mx-auto px-4">
    <!-- Section Header -->
    <div class="flex justify-center mb-4">
      <div class="flex items-center gap-3">
        <span class="w-24 h-[2px] bg-gradient-to-r from-transparent to-[#1a1443]"></span>
        <span class="bg-[#1a1443] text-white p-2 px-5 text-xl rounded-md">Portfolio</span>
        <span class="w-24 h-[2px] bg-gradient-to-l from-transparent to-[#1a1443]"></span>
      </div>
    </div>
    <p class="text-center text-gray-400 text-sm mb-12">Projetos que desenvolvi e publiquei</p>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <div *ngFor="let project of projects" class="project-card group">
        <!-- Cover Image -->
        <div class="relative overflow-hidden rounded-lg mb-4 h-44 bg-[#1a1443]">
          <img
            [src]="project.workCover"
            [alt]="project.workTitle"
            class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
          >
          <!-- Hover overlay with links -->
          <div class="absolute inset-0 bg-gradient-to-t from-[#0d1224]/90 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-3">
            <div class="flex gap-2">
              <a *ngIf="project.linkSite" [href]="project.linkSite" target="_blank" rel="noopener" class="action-btn">
                <i class="fas fa-globe text-sm"></i>
              </a>
              <a *ngIf="project.linkGithub" [href]="project.linkGithub" target="_blank" rel="noopener" class="action-btn">
                <i class="fab fa-github text-sm"></i>
              </a>
            </div>
          </div>
        </div>

        <h3 class="text-base font-bold text-white mb-2">{{ project.workTitle }}</h3>
        <p class="text-xs text-gray-400 leading-relaxed mb-3 line-clamp-2">{{ project.workDescription }}</p>

        <!-- Tech tags -->
        <div class="flex flex-wrap gap-1 mb-3">
          <span *ngFor="let tag of project.workTags"
                class="text-xs text-[#16f2b3] bg-[#16f2b3]/10 border border-[#16f2b3]/20 px-2 py-0.5 rounded-full">
            {{ tag }}
          </span>
        </div>

        <!-- Always-visible link buttons (fallback for non-hover devices) -->
        <div class="flex gap-2 sm:hidden">
          <a *ngIf="project.linkSite" [href]="project.linkSite" target="_blank" rel="noopener" class="action-btn">
            <i class="fas fa-globe text-sm"></i>
          </a>
          <a *ngIf="project.linkGithub" [href]="project.linkGithub" target="_blank" rel="noopener" class="action-btn">
            <i class="fab fa-github text-sm"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
