<div id="experience" class="relative z-50 border-t my-12 lg:my-24 border-[#25213b] bg-[#0D1224] py-12 px-4">
  <!-- Glow -->
  <div class="absolute top-10 right-10 w-64 h-64 bg-indigo-500 rounded-full filter blur-[100px] opacity-10 pointer-events-none"></div>

  <!-- Section Header -->
  <div class="flex justify-center mb-12">
    <div class="flex items-center gap-3">
      <span class="w-24 h-[2px] bg-gradient-to-r from-transparent to-[#1a1443]"></span>
      <span class="bg-[#1a1443] text-white p-2 px-5 text-xl rounded-md">Experience</span>
      <span class="w-24 h-[2px] bg-gradient-to-l from-transparent to-[#1a1443]"></span>
    </div>
  </div>

  <div class="max-w-3xl mx-auto relative">
    <!-- Timeline line -->
    <div class="absolute left-6 top-0 bottom-0 w-[2px] bg-gradient-to-b from-[#16f2b3] via-[#1a1443] to-transparent hidden sm:block"></div>

    <div class="flex flex-col gap-8">
      <div *ngFor="let exp of experiences" class="relative sm:pl-16">
        <!-- Timeline dot -->
        <div class="absolute left-4 top-6 w-4 h-4 rounded-full bg-[#16f2b3] border-2 border-[#0D1224] hidden sm:block -translate-x-1/2"
             style="box-shadow: 0 0 10px rgba(22, 242, 179, 0.5)"></div>

        <!-- Card (clicável → LinkedIn) -->
        <a [href]="exp.linkedinUrl" target="_blank" rel="noopener"
           class="block bg-[#11152c] border border-[#1f223c] rounded-xl p-6 transition-all duration-300 hover:border-[#16f2b3]/40 cursor-pointer no-underline"
           style="transition: border-color 0.3s, box-shadow 0.3s;"
           onmouseenter="this.style.boxShadow='0 0 30px rgba(22,242,179,0.07)'"
           onmouseleave="this.style.boxShadow='none'">

          <div class="flex flex-col sm:flex-row sm:items-start gap-4">
            <!-- Logo -->
            <div class="w-12 h-12 rounded-xl overflow-hidden bg-white flex-shrink-0 flex items-center justify-center p-1">
              <img [src]="exp.experiencecompanyLogo" [alt]="exp.experiencecompanyName" class="w-full h-full object-contain">
            </div>

            <div class="flex-1 min-w-0">
              <!-- Title + Duration -->
              <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 mb-1">
                <h3 class="text-white font-bold text-base sm:text-lg">{{ exp.experiencetitle }}</h3>
                <span class="text-[#16f2b3] text-xs font-mono bg-[#16f2b3]/10 px-3 py-1 rounded-full w-fit whitespace-nowrap">
                  {{ exp.experienceduration }}
                </span>
              </div>
              <p class="text-gray-400 text-sm mb-4">{{ exp.experiencecompanyName }}</p>

              <!-- Descriptions -->
              <ul class="space-y-2 mb-4">
                <li *ngFor="let desc of exp.experiencedescription" class="flex items-start gap-2 text-gray-300 text-sm">
                  <span class="text-[#16f2b3] mt-0.5 flex-shrink-0">&#9658;</span>
                  <span>{{ desc }}</span>
                </li>
              </ul>

              <!-- Tech Stack Tags -->
              <div class="flex flex-wrap gap-2">
                <span *ngFor="let tech of exp.experiencetechStack"
                      class="text-xs text-[#a78bfa] bg-[#a78bfa]/10 border border-[#a78bfa]/20 px-3 py-1 rounded-full">
                  {{ tech }}
                </span>
              </div>
            </div>
          </div>
        </a>
      </div>
    </div>
  </div>
</div>
