  <!-- Theme + reveal bootstrap before first paint (no flash). Reveal fallback if JS never boots. -->
  <script>
    (function () {
      var c = document.documentElement.classList, t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) c.add('dark');
      c.add('js');
      setTimeout(function () { if (!c.contains('reveal-ready')) c.add('reveal-all'); }, 3000);
    })();
  </script>
